name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, test, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node
        uses: pnpm/setup@v3
        with:
          working-directory: .
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  pipeline:
    name: Pipeline unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          working-directory: .
          runtime: node@26

      - name: Install GDAL
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdal-bin python3-gdal

      - name: Test
        run: pnpm run pipeline:test

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          working-directory: .
          runtime: node@26

      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan
        run: pnpm run secrets

  deploy:
    name: Deploy Worker
    needs:
      - web
      - pipeline
      - secrets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: fishy-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node
        uses: pnpm/setup@v3
        with:
          working-directory: .
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}