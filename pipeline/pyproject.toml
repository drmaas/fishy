[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fishy-pipeline"
version = "0.0.0"
description = "Fishy bathymetry tile build tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Wisconsin PDF pipeline: install only when developing WI ingest/georef/contours.
# PyMuPDF (import name ``pymupdf``) is AGPL-3.0 or a commercial license from Artifex.
# georef does not import this extra. It shells out to the GDAL CLI
# (gdal_translate, gdalwarp -tps -dstalpha) when those binaries are on PATH.
# GDAL is MIT/X licensed. CI installs Debian gdal-bin and python3-gdal.
# Contour tracing imports OpenCV, scikit-image, and EasyOCR only for a real sheet.
# rasterio and pytesseract are unused by the current commands.
wi = [
    "pymupdf>=1.24",
    "rasterio>=1.4",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "pytesseract>=0.3.13",
    "easyocr>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fishy_pipeline*"]