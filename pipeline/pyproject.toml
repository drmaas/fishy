[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fishy-pipeline"
version = "0.0.0"
description = "Fishy bathymetry tile build tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Wisconsin PDF pipeline: install only when developing WI ingest/georef/contours.
wi = [
    "pymupdf>=1.24",
    "rasterio>=1.4",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "pytesseract>=0.3.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fishy_pipeline*"]